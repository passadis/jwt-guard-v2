# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: jwt-sentinel-v2
services:
    jwt-sentinel-gate-explainer:
        project: ./src/SentinelHostedAgent
        host: azure.ai.agent
        language: csharp
        uses:
            - proj-edgegrd-agent
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: SentinelHostedAgent.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: GATEWAY_RESOURCE_ID
              value: ${GATEWAY_RESOURCE_ID}
            - name: LAW_WORKSPACE_GUID
              value: ${LAW_WORKSPACE_GUID}
            - name: PROTECTED_HOST
              value: ${PROTECTED_HOST}
            - name: TENANT_ID
              value: ${TENANT_ID}
            - name: API_CLIENT_ID
              value: ${API_CLIENT_ID}
            - name: BROKER_BASE_URI
              value: ${BROKER_BASE_URI}
            - name: TOOLBOX_NAME
              value: ${TOOLBOX_NAME}
        kind: hosted
        name: jwt-sentinel-gate-explainer
        protocols:
            - protocol: responses
              version: 2.0.0
    proj-edgegrd-agent:
        host: azure.ai.project
        endpoint: https://aif-edgegrdagent-havcc.services.ai.azure.com/api/projects/proj-edgegrd-agent
infra:
    provider: microsoft.foundry
