name: jwt-sentinel-hosted-parity-v4-targeted
agent:
  name: jwt-sentinel-gate-explainer
  kind: hosted
  version: "4"
dataset:
  local_uri: evaluation/v4-targeted.jsonl
evaluators:
  - name: jwt-sentinel-security-parity
    version: "2"
    local_uri: evaluators/jwt-sentinel-security-parity/rubric_dimensions.v2.json
options:
  eval_model: gpt-4o
  pass_threshold: 1.0
  max_samples: 7
generation_instruction: >-
  Run only the seven reviewed v4 regression cases. Do not generate or include real
  tokens, secrets, resource credentials, Terraform state, or user conversation content.
