name: jwt-sentinel-hosted-agent
services:
  jwt-sentinel-gate-explainer:
    project: .
    host: azure.ai.agent
    language: csharp
    uses:
      - proj-edgegrddev-agent
    codeConfiguration:
      dependencyResolution: remote_build
      runtime: dotnet_10
      entryPoint: SentinelHostedAgent.dll
    environmentVariables:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      GATEWAY_RESOURCE_ID: ${GATEWAY_RESOURCE_ID}
      LAW_WORKSPACE_GUID: ${LAW_WORKSPACE_GUID}
      PROTECTED_HOST: ${PROTECTED_HOST}
      TENANT_ID: ${TENANT_ID}
      API_CLIENT_ID: ${API_CLIENT_ID}
      BROKER_BASE_URI: ${BROKER_BASE_URI}
      TOOLBOX_NAME: ${TOOLBOX_NAME}
    container:
      resources:
        cpu: 0.5
        memory: 1Gi
    protocols:
      - protocol: responses
        version: 2.0.0
    kind: hosted
    name: jwt-sentinel-gate-explainer
  proj-edgegrddev-agent:
    host: azure.ai.project
    endpoint: https://aif-edgegrddevagent-wq7hd.services.ai.azure.com/api/projects/proj-edgegrddev-agent
infra:
  provider: microsoft.foundry
